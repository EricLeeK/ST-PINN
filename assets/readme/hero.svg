    <text x="60" y="72" font-family="'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="600" fill="#77669f" text-anchor="start">SPACE–TIME DECOMPOSITION</text>
    <text x="60" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="88" font-weight="700" fill="#342c4e" text-anchor="start">ST-PINN</text>
    <text x="60" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="400" fill="#342c4e" text-anchor="start">Learn space.</text>
    <text x="60" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="400" fill="#342c4e" text-anchor="start">Represent time explicitly.</text>
    <text x="60" y="400" font-family="'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="600" fill="#77669f" text-anchor="start">SPATIAL NETWORK × FIXED TEMPORAL BASIS</text>
    <text x="716" y="88" font-family="Georgia,'Songti SC',serif" font-size="36" font-weight="500" fill="#342c4e" text-anchor="start">u(x,t) ≈ C(x) · T(t)</text>
